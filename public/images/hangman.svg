<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgGlowHM" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#132030"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlowHM)"/>

  <!-- subtle grid -->
  <g stroke="rgba(94,207,190,0.06)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- gallows -->
  <g stroke="#5ecfbe" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="230" y1="360" x2="230" y2="70"/>
    <line x1="170" y1="360" x2="290" y2="360"/>
    <line x1="230" y1="70" x2="400" y2="70"/>
    <line x1="230" y1="110" x2="270" y2="70"/>
    <line x1="400" y1="70" x2="400" y2="115"/>
  </g>

  <!-- stick figure -->
  <g stroke="#f0ece4" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="400" cy="145" r="30" fill="none"/>
    <line x1="400" y1="175" x2="400" y2="255"/>
    <line x1="400" y1="195" x2="365" y2="230"/>
    <line x1="400" y1="195" x2="435" y2="230"/>
    <line x1="400" y1="255" x2="368" y2="310"/>
    <line x1="400" y1="255" x2="432" y2="310"/>
  </g>

  <!-- word blanks -->
  <g stroke="#5ecfbe" stroke-width="5" stroke-linecap="round">
    <line x1="260" y1="400" x2="300" y2="400"/>
    <line x1="330" y1="400" x2="370" y2="400"/>
    <line x1="400" y1="400" x2="440" y2="400"/>
    <line x1="470" y1="400" x2="510" y2="400"/>
  </g>
  <g font-family="monospace" font-size="34" fill="#5ecfbe" text-anchor="middle">
    <text x="280" y="392">W</text>
    <text x="350" y="392">O</text>
    <text x="420" y="392">R</text>
    <text x="490" y="392">D</text>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="3" fill="rgba(240,236,228,0.35)">HANGMAN · PYTHON</text>
</svg>
