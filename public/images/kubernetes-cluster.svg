<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#132030"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(94,207,190,0.35)"/>
      <stop offset="100%" stop-color="rgba(94,207,190,0)"/>
    </radialGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fe0d1"/>
      <stop offset="100%" stop-color="#3aafa0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlow)"/>

  <!-- subtle grid -->
  <g stroke="rgba(94,207,190,0.06)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>

  <circle cx="400" cy="225" r="220" fill="url(#hubGlow)"/>

  <!-- connections: hub to satellite nodes -->
  <g stroke="rgba(94,207,190,0.45)" stroke-width="2">
    <line x1="400" y1="225" x2="170" y2="110"/>
    <line x1="400" y1="225" x2="170" y2="340"/>
    <line x1="400" y1="225" x2="630" y2="110"/>
    <line x1="400" y1="225" x2="630" y2="340"/>
    <line x1="400" y1="225" x2="400" y2="60"/>
  </g>
  <g stroke="rgba(94,207,190,0.2)" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="170" y1="110" x2="170" y2="340"/>
    <line x1="630" y1="110" x2="630" y2="340"/>
  </g>

  <!-- satellite nodes -->
  <g>
    <circle cx="170" cy="110" r="26" fill="#0f1521" stroke="#5ecfbe" stroke-width="2"/>
    <text x="170" y="116" text-anchor="middle" font-family="monospace" font-size="13" fill="#5ecfbe">Poll</text>

    <circle cx="170" cy="340" r="26" fill="#0f1521" stroke="#5ecfbe" stroke-width="2"/>
    <text x="170" y="346" text-anchor="middle" font-family="monospace" font-size="13" fill="#5ecfbe">Redis</text>

    <circle cx="630" cy="110" r="26" fill="#0f1521" stroke="#5ecfbe" stroke-width="2"/>
    <text x="630" y="116" text-anchor="middle" font-family="monospace" font-size="12" fill="#5ecfbe">Result</text>

    <circle cx="630" cy="340" r="26" fill="#0f1521" stroke="#5ecfbe" stroke-width="2"/>
    <text x="630" y="346" text-anchor="middle" font-family="monospace" font-size="10" fill="#5ecfbe">Postgres</text>

    <circle cx="400" cy="60" r="22" fill="#0f1521" stroke="rgba(94,207,190,0.6)" stroke-width="2"/>
    <text x="400" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(94,207,190,0.85)">Traefik</text>
  </g>

  <!-- central kubernetes wheel -->
  <g transform="translate(400,225)">
    <circle r="70" fill="#0f1521" stroke="url(#wheelGrad)" stroke-width="3"/>
    <g fill="none" stroke="#5ecfbe" stroke-width="3" stroke-linecap="round">
      <circle r="34"/>
      <line x1="0" y1="-34" x2="0" y2="-52"/>
      <line x1="29.4" y1="-17" x2="45" y2="-26"/>
      <line x1="29.4" y1="17" x2="45" y2="26"/>
      <line x1="0" y1="34" x2="0" y2="52"/>
      <line x1="-29.4" y1="17" x2="-45" y2="26"/>
      <line x1="-29.4" y1="-17" x2="-45" y2="-26"/>
    </g>
    <circle r="7" fill="#5ecfbe"/>
  </g>

  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="3" fill="rgba(240,236,228,0.35)">KUBERNETES CLUSTER</text>
</svg>
